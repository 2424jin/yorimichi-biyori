<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>大学に持っていく物チェックリスト</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
      }

      main {
        width: min(100%, 640px);
        margin: 0 auto;
        padding: 32px;
        border: 1px solid #e5e9f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(31 41 55 / 7%);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2rem);
      }

      .description {
        margin: 10px 0 26px;
        color: #64748b;
        line-height: 1.6;
      }

      form {
        display: flex;
        gap: 10px;
      }

      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
      }

      input[type="text"]:focus-visible,
      button:focus-visible,
      input[type="checkbox"]:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .add-button {
        color: #fff;
        background: #2563eb;
      }

      .add-button:hover {
        background: #1d4ed8;
      }

      #item-list {
        display: grid;
        gap: 8px;
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 8px 10px 8px 14px;
        border: 1px solid #e5e9f0;
        border-radius: 12px;
      }

      .item input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: #2563eb;
      }

      .item-label {
        flex: 1;
        overflow-wrap: anywhere;
      }

      .item:has(input:checked) .item-label {
        color: #64748b;
        text-decoration: line-through;
      }

      .delete-button {
        padding: 7px 10px;
        color: #b91c1c;
        background: #fef2f2;
      }

      .delete-button:hover {
        background: #fee2e2;
      }

      #summary {
        margin: 18px 0 0;
        color: #64748b;
        font-size: 0.9rem;
        text-align: right;
      }

      #notice {
        min-height: 1.5em;
        margin: 12px 0 0;
        color: #b91c1c;
        font-size: 0.9rem;
      }

      @media (max-width: 480px) {
        body {
          padding: 20px 12px;
        }

        main {
          padding: 24px 18px;
        }

        form {
          align-items: stretch;
        }

        .add-button {
          padding-inline: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>大学に持っていく物</h1>
      <p class="description">忘れ物がないか、出発前にチェックしましょう。</p>

      <form id="add-form">
        <input
          id="new-item"
          type="text"
          aria-label="追加する持ち物"
          placeholder="持ち物を入力"
          maxlength="100"
          autocomplete="off"
          required
        >
        <button class="add-button" type="submit">追加</button>
      </form>

      <ul id="item-list" aria-label="持ち物リスト"></ul>
      <p id="summary" aria-live="polite"></p>
      <p id="notice" role="status" aria-live="polite"></p>
    </main>

    <script>
      const STORAGE_KEY = "university-packing-checklist";
      const starterItems = ["学生証", "財布", "スマートフォン", "筆記用具", "ノート"];
      const list = document.querySelector("#item-list");
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#new-item");
      const summary = document.querySelector("#summary");
      const notice = document.querySelector("#notice");

      function createId() {
        return typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function loadItems() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) {
            return starterItems.map((name) => ({ id: createId(), name, checked: false }));
          }

          const parsed = JSON.parse(saved);
          if (
            !Array.isArray(parsed) ||
            !parsed.every(
              (item) =>
                item &&
                typeof item.id === "string" &&
                typeof item.name === "string" &&
                typeof item.checked === "boolean",
            )
          ) {
            throw new Error("保存データの形式が正しくありません。");
          }
          return parsed;
        } catch (error) {
          notice.textContent = `保存データを読み込めませんでした: ${error.message}`;
          return starterItems.map((name) => ({ id: createId(), name, checked: false }));
        }
      }

      let items = loadItems();

      function saveItems() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          notice.textContent = "";
          return true;
        } catch (error) {
          notice.textContent = `変更を保存できませんでした: ${error.message}`;
          return false;
        }
      }

      function render() {
        list.replaceChildren();
        for (const item of items) {
          const row = document.createElement("li");
          row.className = "item";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = item.checked;
          checkbox.setAttribute("aria-label", `${item.name}をチェック`);
          checkbox.addEventListener("change", () => {
            item.checked = checkbox.checked;
            saveItems();
            updateSummary();
          });

          const label = document.createElement("span");
          label.className = "item-label";
          label.textContent = item.name;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.textContent = "削除";
          deleteButton.setAttribute("aria-label", `${item.name}を削除`);
          deleteButton.addEventListener("click", () => {
            items = items.filter((current) => current.id !== item.id);
            saveItems();
            render();
          });

          row.append(checkbox, label, deleteButton);
          list.append(row);
        }
        updateSummary();
      }

      function updateSummary() {
        const checkedCount = items.filter((item) => item.checked).length;
        summary.textContent = `${checkedCount} / ${items.length} 件チェック済み`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          input.focus();
          return;
        }
        items.push({ id: createId(), name, checked: false });
        saveItems();
        render();
        input.value = "";
        input.focus();
      });

      render();
    </script>
  </body>
</html>
